<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>losMetritos · Mosca</title>
<link rel="stylesheet" href="fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }

  /* mosca arriba a la derecha */
  #mosca { position:absolute; top:40px; right:40px; display:flex; flex-direction:column; align-items:stretch; filter:drop-shadow(0 4px 10px rgba(0,0,0,.25)); }
  #marca { position:relative; overflow:hidden; background:var(--rojo); border:4px solid var(--negro); border-bottom:0; border-radius:8px 8px 0 0;
           padding:14px 26px 12px; color:var(--blanco); font-family:'Inter',Helvetica,Arial,sans-serif; letter-spacing:-.04em; line-height:1; white-space:nowrap; }
  #marca .l { font-weight:300; font-size:46px; position:relative; z-index:1; }
  #marca .m { font-weight:900; font-size:46px; position:relative; z-index:1; }
  #pie { background:var(--negro); border-radius:0 0 8px 8px; padding:7px 0 8px; display:flex; justify-content:center; align-items:center; gap:10px; }
  #pie img { height:22px; display:block; }
  #pie .vivo { font:900 13px 'Inter',sans-serif; letter-spacing:.12em; color:var(--blanco); display:flex; align-items:center; gap:6px; }
  #pie .vivo::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--rojo); animation:late 1.6s ease-in-out infinite; }
  @keyframes late { 50% { opacity:.2; } }

  /* estrellitas y brillo */
  .st { position:absolute; background:var(--rojo-osc); opacity:0; animation:twinkle ease-in-out infinite;
        clip-path:polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  .st.dot { border-radius:50%; clip-path:none; }
  @keyframes twinkle { 0%,100% { opacity:0; transform:scale(.4); } 50% { opacity:var(--o); transform:scale(1) rotate(var(--r)); } }
  #marca::after { content:""; position:absolute; top:0; bottom:0; width:60%; left:-80%; z-index:2;
                  background:linear-gradient(105deg, transparent, rgba(251,255,255,.35), transparent); animation:brillo 12s ease-in-out 1.5s infinite; }
  @keyframes brillo { 0%, 88% { left:-80%; } 100% { left:130%; } }

  #mosca { animation:entra 1s cubic-bezier(.22,.9,.24,1) both; }
  @keyframes entra { from { opacity:0; transform:translateY(-30px); } to { opacity:1; transform:none; } }
  body.fondo { background:#888 repeating-conic-gradient(#7a7a7a 0 25%, #959595 0 50%) 0 0/60px 60px; }
</style>
</head>
<body>
  <div id="mosca">
    <div id="marca"><span class="l">los</span><span class="m">Metritos</span></div>
    <div id="pie"><img src="logolametro.png" alt="La Metro"><span class="vivo">EN VIVO</span></div>
  </div>
<script>
  if (new URLSearchParams(location.search).has('fondo')) document.body.classList.add('fondo');
  const r = (a, b) => a + Math.random() * (b - a), box = document.getElementById('marca');
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('i'), sp = i % 2 === 0, z = sp ? r(9, 16) : r(3, 5);
    s.className = 'st' + (sp ? '' : ' dot');
    s.style.cssText = `width:${z}px;height:${z}px;left:${r(2, 95)}%;top:${r(5, 85)}%;animation-duration:${r(4, 8)}s;animation-delay:-${r(0, 8)}s`;
    s.style.setProperty('--o', r(.6, 1).toFixed(2)); s.style.setProperty('--r', r(-40, 40).toFixed(0) + 'deg');
    box.appendChild(s);
  }
</script>
</body>
</html>
