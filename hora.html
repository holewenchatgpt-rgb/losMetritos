<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>losMetritos · Hora y temperatura</title>
<link rel="stylesheet" href="fonts.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }

  /* Dos solapas apoyadas arriba de la tarjeta del QR (que mide 340px y está a 40px del borde inferior → arriba en 380px) */
  #solapas { position:fixed; right:40px; bottom:380px; width:270px; height:48px; display:flex; font-family:'Inter',Helvetica,Arial,sans-serif; }
  .solapa { display:flex; align-items:center; justify-content:center; line-height:1; white-space:nowrap; letter-spacing:-.01em; font-variant-numeric:tabular-nums; }
  #caja-hora { flex:1.25; background:var(--negro); color:var(--blanco); font-weight:900; font-size:32px; border-radius:12px 0 0 0; gap:9px; }
  #caja-hora::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--rojo); animation:late 2s steps(1) infinite; }
  @keyframes late { 50% { opacity:0; } }
  #caja-temp { flex:1; background:var(--blanco); color:var(--negro); font-weight:300; font-size:30px; border-radius:0 12px 0 0; border:4px solid var(--negro); border-bottom:0; }
  body.fondo { background:#888 repeating-conic-gradient(#7a7a7a 0 25%, #959595 0 50%) 0 0/60px 60px; }
</style>
</head>
<body>
  <div id="solapas">
    <div class="solapa" id="caja-hora"><span id="hora">00:00</span></div>
    <div class="solapa" id="caja-temp"><span id="temp">--.-°</span></div>
  </div>

<script src="config.js"></script>
<script>
  if (new URLSearchParams(location.search).has('fondo')) document.body.classList.add('fondo');

  // Hora de Córdoba (formato 00:00, 24 h)
  const fmtHora = new Intl.DateTimeFormat('en-GB', { timeZone: CONFIG.ZONA, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const actualizarHora = () => { document.getElementById('hora').textContent = fmtHora.format(new Date()); };

  // Temperatura (Open-Meteo, no necesita clave)
  const URL_CLIMA = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.LAT}&longitude=${CONFIG.LON}&current=temperature_2m&timezone=${encodeURIComponent(CONFIG.ZONA)}`;
  async function actualizarTemp() {
    try {
      const d = await (await fetch(URL_CLIMA, { cache: 'no-store' })).json();
      document.getElementById('temp').textContent = d.current.temperature_2m.toFixed(1) + '°';
    } catch (e) { /* si falla, deja el último valor */ }
  }

  actualizarHora(); actualizarTemp();
  setInterval(actualizarHora, 1000);
  setInterval(actualizarTemp, 10 * 60 * 1000);
</script>
</body>
</html>
