<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>losMetritos · Zócalo</title>
<link rel="stylesheet" href="fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: "Bebas Neue", Impact, sans-serif; }

  /* zócalo: 200px libres a la izquierda, 340px a la derecha (lugar del QR), 90px abajo (encima de la barra de mensajes) */
  #wrap { position: absolute; left: 200px; right: 340px; bottom: 90px; display: flex; flex-direction: column; align-items: flex-start; visibility: hidden; }

  /* pestaña (texto chico): negra con letras blancas y estrellita roja */
  #tab { position: relative; z-index: 0; height: 54px; margin-left: 196px; padding: 0 30px 0 32px; display: flex; align-items: center; gap: 14px;
         background: var(--negro); color: var(--blanco); font-size: 38px; letter-spacing: .08em; max-width: 1100px; overflow: hidden;
         border-radius: 6px 18px 0 0; white-space: nowrap; }
  #tab::before { content: ""; flex: none; width: 20px; height: 20px; background: var(--rojo); margin-top: -4px;
                 clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  #tabtxt { padding-top: 4px; }

  /* barra principal: roja, borde negro */
  #bar { z-index: 1; width: 100%; height: 140px; background: var(--rojo); border: 4px solid var(--negro); border-radius: 6px; overflow: hidden;
         position: relative; display: flex; align-items: center; padding: 0 40px 0 262px; }

  /* sello del programa a la izquierda: bloque blanco con corte diagonal */
  #sello { position: absolute; z-index: 2; left: 0; top: 0; bottom: 0; width: 232px; background: var(--blanco);
           clip-path: polygon(0 0, 100% 0, calc(100% - 30px) 100%, 0 100%);
           display: flex; flex-direction: column; justify-content: center; padding-left: 26px; color: var(--rojo);
           font-family: "Inter", Helvetica, Arial, sans-serif; line-height: .92; letter-spacing: -.035em; }
  #sello .l { font-weight: 300; font-size: 34px; }
  #sello .m { font-weight: 900; font-size: 41px; }

  #box { position: relative; z-index: 1; flex: 1; min-width: 0; height: 112px; display: flex; align-items: center; overflow: visible; }
  #big { position: relative; top: .05em; width: 100%; text-align: left; color: var(--blanco); line-height: .8; letter-spacing: .02em; font-size: 84px; text-transform: uppercase; overflow-wrap: break-word; }

  /* estrellitas de fondo en rojo oscuro */
  #stars { position: absolute; inset: 0; left: 232px; overflow: hidden; pointer-events: none; z-index: 0; }
  .st { position: absolute; border-radius: 50%; opacity: 0; background: var(--rojo-osc); animation: twinkle ease-in-out infinite; }
  .st.sp { border-radius: 0; clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: translate(0, 0) scale(.4) rotate(0deg); } 50% { opacity: var(--o); transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--r)); } }

  /* modo previsualización (dentro del panel de control): fondo a cuadros para ver la transparencia */
  body.preview { background: #d6d6d6 repeating-conic-gradient(#c9c9c9 0 25%, #e2e2e2 0 50%) 0 0 / 60px 60px; }
  body.preview::after { content: ""; position: absolute; left: 200px; right: 340px; top: 40px; bottom: 90px; border: 3px dashed rgba(29,29,27,.25); pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="tab"><span id="tabtxt"></span></div>
  <div id="bar">
    <div id="stars"></div>
    <div id="sello"><span class="l">los</span><span class="m">Metritos</span></div>
    <div id="box"><div id="big"></div></div>
  </div>
</div>

<script src="config.js"></script>
<script src="sync.js"></script>
<script>
const $ = id => document.getElementById(id);
const wrap = $("wrap"), tab = $("tab"), tabtxt = $("tabtxt"), bar = $("bar"), big = $("big"), box = $("box"), sello = $("sello");
const QS = new URLSearchParams(location.search);
const PREVIEW = QS.has("preview"), LIVE = QS.has("live"); // preview = borrador | live = espejo de lo que está al aire
const EASE = "cubic-bezier(.22,.9,.24,1)";
const fx = (el, kf, ms, delay = 0, easing = EASE) => { el.getAnimations().forEach(a => a.cancel()); return el.animate(kf, { duration: ms, delay, easing, fill: "both" }).finished; };

function fit() {                       // achica la letra hasta que entre (1 o 2 líneas)
  for (let s = 132; s >= 12; s -= 1) {
    big.style.fontSize = s + "px";
    if (big.scrollHeight <= box.clientHeight && big.scrollWidth <= box.clientWidth) break;
  }
}
function fill(s) {
  const small = (s.small || "").trim().toUpperCase();
  tabtxt.textContent = small; tab.style.display = small ? "flex" : "none"; tab.style.fontSize = "";
  for (let t = 38; small && t >= 12 && tab.scrollWidth > tab.clientWidth; t--) tab.style.fontSize = t + "px";
  big.textContent = (s.big || "").trim().toUpperCase();
  fit();
}

let shown = false, cur = { small: "", big: "" };
const wait = ms => new Promise(r => setTimeout(r, ms));
const hasTab = () => tab.style.display !== "none";
const fadeOut = (el, ms = 280) => fx(el, [{ opacity: 1 }, { opacity: 0 }], ms, 0, "ease-in");
const fadeIn  = (el, ms = 480, d = 0) => fx(el, [{ opacity: 0 }, { opacity: 1 }], ms, d, "ease-out");
const tabIn  = d => fx(tab, [{ opacity: 0, transform: "translateY(100%)" }, { opacity: 1, offset: .15 }, { opacity: 1, transform: "translateY(0)" }], 550, d || 0);
const tabOut = () => fx(tab, [{ opacity: 1, transform: "translateY(0)" }, { opacity: 1, offset: .85 }, { opacity: 0, transform: "translateY(100%)" }], 400);

// aparece por primera vez (o después de ocultarse): se abre la barra, entra el sello y el texto aparece con fade
async function animIn(s) {
  fill(s); cur = { small: s.small || "", big: s.big || "" };
  wrap.style.visibility = "visible";
  fx(bar, [{ clipPath: "inset(0 100% 0 0 round 6px)" }, { clipPath: "inset(0 0 0 0 round 6px)" }], 700);
  fx(sello, [{ transform: "translateX(-105%)" }, { transform: "none" }], 600, 180);
  fadeIn(big, 520, 420);
  if (hasTab()) { fadeIn(tabtxt, 1); await tabIn(600); } else await wait(950);
  shown = true;
}
// se oculta por completo
async function animOut() {
  fadeOut(big, 250); if (hasTab()) tabOut();
  fx(sello, [{ transform: "none" }, { transform: "translateX(-105%)" }], 450, 120, "ease-in");
  await fx(bar, [{ clipPath: "inset(0 0 0 0 round 6px)" }, { clipPath: "inset(0 100% 0 0 round 6px)" }], 520, 260, "ease-in");
  wrap.style.visibility = "hidden"; shown = false;
}
// cambio de texto en vivo: la barra queda fija y el texto cambia con un FADE
async function swap(s) {
  const had = hasTab(), will = !!(s.small || "").trim();
  const smallChanged = (s.small || "") !== cur.small;
  await Promise.all([
    fadeOut(big),
    had && !will ? tabOut() : null,
    had && will && smallChanged ? fadeOut(tabtxt) : null
  ]);
  fill(s); cur = { small: s.small || "", big: s.big || "" };
  await Promise.all([
    fadeIn(big),
    !had && will ? (tabtxt.style.opacity = 1, tabIn()) : null,
    had && will && smallChanged ? fadeIn(tabtxt) : null
  ]);
}

let chain = Promise.resolve(), lastId = null;
function apply(s) {
  chain = chain.then(async () => {
    const on = s.visible && s.big;
    if (on && !shown) await animIn(s);
    else if (on) await swap(s);
    else if (shown) await animOut();
  }).catch(console.error);
}

// estrellitas: aparecen y desaparecen suavemente y reaparecen en otro lugar
(function () {
  const rnd = (a, b) => a + Math.random() * (b - a), N = 70;
  const place = st => { st.style.left = rnd(0, 99) + "%"; st.style.top = rnd(3, 90) + "%"; };
  for (let i = 0; i < N; i++) {
    const st = document.createElement("i"), sp = i % 3 === 0, z = sp ? rnd(14, 28) : rnd(4, 7);
    st.className = "st" + (sp ? " sp" : "");
    st.style.width = st.style.height = z + "px";
    st.style.setProperty("--o", rnd(.55, 1).toFixed(2));
    st.style.setProperty("--dx", rnd(-14, 14).toFixed(1) + "px");
    st.style.setProperty("--dy", rnd(-10, 10).toFixed(1) + "px");
    st.style.setProperty("--r", (sp ? rnd(-45, 45) : 0).toFixed(0) + "deg");
    st.style.animationDuration = rnd(4, 9) + "s";
    st.style.animationDelay = "-" + rnd(0, 9) + "s";
    place(st); st.addEventListener("animationiteration", () => place(st));
    $("stars").appendChild(st);
  }
})();

if (PREVIEW || LIVE) document.body.classList.add("preview");
if (PREVIEW) {
  window.addEventListener("message", e => {
    const d = e.data || {};
    if (d.type !== "draft") return;
    fill(d); wrap.style.visibility = d.big ? "visible" : "hidden";
  });
} else {
  const tick = async () => {
    try {
      const s = await Sync.get();
      if (s && s.id !== lastId) { lastId = s.id; apply(s); }
    } catch (e) { console.warn(e); }
    setTimeout(tick, CONFIG.POLL_MS);
  };
  document.fonts.ready.then(tick);
}
</script>
</body>
</html>
